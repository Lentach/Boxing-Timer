<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxing Round Interval Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Boxing Timer</h1>

    <div class="timer-container">
        <div id="timer-display">03:00</div>

        <div id="status-indicator" class="prepare">PREPARE</div>

        <div id="round-counter">Round 1 / 12</div>
    </div>

    <div class="controls-container" id="controls">
        <button id="start-button">Start</button>
        <button id="stop-button">Stop</button>
        <button id="reset-button">Reset</button>
    </div>

    <div class="animation-container" id="animation-container">
        <img src="https://media3.giphy.com/media/39BdMOJMK2YVqktnlS/giphy.gif" alt="Boxing Animation">
    </div>

    <script src="app.js"></script>
</body>
</html>
